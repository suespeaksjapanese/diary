<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語日記 30日チャレンジ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Zen Maru Gothic & Kiwi Maru) -->
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Zen Maru Gothic', 'Kiwi Maru', sans-serif;
            background-color: #f8fafc;
        }
        .check-anim {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .check-anim:active {
            transform: scale(0.85);
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-12">

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-4 pt-8 space-y-6">

        <!-- Top Title Bar -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3.5">
                <i class="fa-solid fa-calendar-check text-amber-300 text-2xl sm:text-3xl"></i>
                <h1 class="font-extrabold text-slate-700 text-2xl sm:text-3xl tracking-tight">日記チェック表 (20日間)</h1>
            </div>
            
            <!-- Action Button: Save -->
            <div class="flex items-center justify-end w-full sm:w-auto">
                <button onclick="manualSave()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold rounded-xl text-sm shadow-sm transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>保存</span>
                </button>
            </div>
        </div>

        <!-- Progress Overview Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Yuki's Card -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-12 h-12 rounded-full bg-sky-200/70 text-sky-600 flex items-center justify-center text-xl shadow-sm shrink-0">
                            <i class="fa-solid fa-cloud text-white drop-shadow-sm"></i>
                        </div>
                        <div>
                            <h2 class="font-bold text-slate-800 text-lg">ゆうき</h2>
                            <p class="text-sm font-medium text-slate-400" id="yuki-percent">達成率 0%</p>
                        </div>
                    </div>
                    <span class="text-3xl font-black text-sky-400" id="yuki-count">0 <span class="text-xs text-slate-400 font-normal">/ 20日</span></span>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden">
                    <div id="yuki-bar" class="bg-gradient-to-r from-sky-200 to-sky-300 h-4 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>

            <!-- Hikari's Card -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-3xl font-black text-pink-400" id="hikari-count">0 <span class="text-xs text-slate-400 font-normal">/ 20日</span></span>
                    <div class="flex items-center space-x-3.5 text-right">
                        <div>
                            <h2 class="font-bold text-slate-800 text-lg">ひかり</h2>
                            <p class="text-sm font-medium text-slate-400" id="hikari-percent">達成率 0%</p>
                        </div>
                        <div class="w-12 h-12 rounded-full bg-pink-100/80 text-pink-400 flex items-center justify-center shadow-sm shrink-0">
                            <!-- Cherry Blossom SVG -->
                            <svg class="w-8 h-8 text-pink-300 fill-current" viewBox="0 0 24 24">
                                <path d="M12 12c-1.2-2.5-1.5-4.5-.5-5.5 1.5-1.5 4.5.5 4.5.5s2 3 .5 4.5c-1 1-3 .7-4.5-.5zm0 0c2.5-1.2 4.5-1.5 5.5-.5 1.5 1.5-.5 4.5-.5 4.5s-3 2-4.5.5c-1-1-.7-3 .5-4.5zm0 0c1.2 2.5 1.5 4.5.5 5.5-1.5 1.5-4.5-.5-4.5-.5s-2-3-.5-4.5c1-1 3-.7 4.5.5zm0 0c-2.5 1.2-4.5 1.5-5.5.5-1.5-1.5.5-4.5.5-4.5s3-2 4.5-.5c1 1 .7 3-.5 4.5zm0 0c-1.8-1.8-2.7-3.8-2.2-4.8 1-1.8 4.2-1.2 4.2-1.2s1.8 3.2.2 4.8c-1.1 1.1-1.5.5-2.2 1.2z"/>
                                <circle cx="12" cy="12" r="1.8" class="text-pink-200 fill-current"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden flex justify-end">
                    <div id="hikari-bar" class="bg-gradient-to-l from-pink-200 to-pink-300 h-4 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>

        </div>

        <!-- Main Tracker Table Container -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse table-fixed">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-sm uppercase tracking-wider border-b border-slate-100">
                            <th class="py-3.5 px-2 text-center font-bold text-sky-500 w-[22%]">勇気</th>
                            <th class="py-3.5 px-2 text-center font-bold text-slate-600 text-base w-[56%]">日付</th>
                            <th class="py-3.5 px-4 text-center font-bold text-pink-400 w-[22%]">光</th>
                        </tr>
                    </thead>
                    <tbody id="tracker-rows" class="divide-y divide-slate-100 text-base">
                        <!-- Dynamic JavaScript insertion -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Custom Toast Alert -->
    <div id="toast-message" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800/90 backdrop-blur-md text-white px-5 py-3 rounded-full text-sm font-bold shadow-lg transition-all duration-300 transform opacity-0 translate-y-4 pointer-events-none z-50 flex items-center space-x-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-text">保存しました！</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Supabase Configuration
        const SUPABASE_URL = "https://hblyyvxdkmdjwavcsrew.supabase.co";
        const SUPABASE_KEY = "sb_publishable_xqJoid4LY0yNzLzmhopcEw_ffbRxVzo";
        const TABLE_NAME = "diary_challenge";

        // State
        let state = {
            yuki: Array(20).fill(false),
            hikari: Array(20).fill(false)
        };

        const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

        document.addEventListener('DOMContentLoaded', function() {
            loadLocalStorage();
            renderTracker();
            updateProgress();
            
            // Background safe sync (non-blocking)
            setTimeout(syncFromSupabase, 500);
        });

        function saveToStorage() {
            try {
                localStorage.setItem('jp_diary_state', JSON.stringify(state));
            } catch (e) {
                console.error("Storage save error", e);
            }
        }

        function loadLocalStorage() {
            const saved = localStorage.getItem('jp_diary_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.yuki = (parsed.yuki && parsed.yuki.length === 20) ? parsed.yuki : Array(20).fill(false);
                    state.hikari = (parsed.hikari && parsed.hikari.length === 20) ? parsed.hikari : Array(20).fill(false);
                } catch(e) {
                    console.error("Storage load error", e);
                }
            }
        }

        // Supabase Sync Read with strict Timeout protection
        async function syncFromSupabase() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000); // 3초 타임아웃 강제 제한

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?id=eq.main_challenge_room&select=*`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0 && data[0].data) {
                        const cloudData = data[0].data;
                        if (JSON.stringify(state.yuki) !== JSON.stringify(cloudData.yuki) ||
                            JSON.stringify(state.hikari) !== JSON.stringify(cloudData.hikari)) {
                            state.yuki = cloudData.yuki || Array(20).fill(false);
                            state.hikari = cloudData.hikari || Array(20).fill(false);
                            saveToStorage();
                            renderTracker();
                            updateProgress();
                        }
                    }
                }
            } catch (err) {
                // 타임아웃 또는 네트워크 차단 시 조용히 로컬 모드로 전환 (앱 멈춤 현상 원천 방지)
                console.log("Cloud sync skipped, using local storage.");
            }
        }

        // Supabase Sync Write with Timeout protection
        async function saveToSupabase() {
            saveToStorage(); // 항상 로컬에 먼저 안전하게 저장
            showToast('保存しました！');

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);

            try {
                const payload = {
                    id: "main_challenge_room",
                    data: state,
                    updated_at: new Date().toISOString()
                };

                await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'resolution=merge-duplicates'
                    },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
            } catch (err) {
                // 네트워크 지연으로 인한 타임아웃 발생 시에도 UI는 정상 작동 유지
                console.log("Background cloud save deferred.");
            }
        }

        // Render Tracker Rows
        function renderTracker() {
            const tbody = document.getElementById('tracker-rows');
            if (!tbody) return;

            tbody.innerHTML = '';

            const currentYear = new Date().getFullYear();
            let currentDate = new Date(currentYear, 10, 5); 
            let count = 0;

            const monthKana = ['いちがつ', 'にがつ', 'さんがつ', 'しがつ', 'ごがつ', 'ろくがつ', 'しちがつ', 'はちがつ', 'くがつ', 'じゅうがつ', 'じゅういちがつ', 'じゅうにがつ'];
            const dateKana = {
                1: 'ついたち', 2: 'ふつか', 3: 'みっか', 4: 'よっか', 5: 'いつか',
                6: 'むいか', 7: 'なのか', 8: 'ようか', 9: 'ここのか', 10: 'とおか',
                11: 'じゅういちにち', 12: 'じゅうににち', 13: 'じゅうさんにち', 14: 'じゅうよっか', 15: 'じゅうごにち',
                16: 'じゅうろくにち', 17: 'じゅうしちにち', 18: 'じゅうはちにち', 19: 'じゅうくにし', 20: 'はつか',
                21: 'にじゅういちにち', 22: 'にじゅうににち', 23: 'にじゅうさんにち', 24: 'にじゅうよっか', 25: 'にじゅうごにち',
                26: 'にじゅうろくにち', 27: 'にじゅうしちにち', 28: 'にじゅうはちにち', 29: 'じゅうくにち', 30: 'さんじゅうにち', 31: 'さんじゅういちにち'
            };
            const dayKana = ['にち', 'げつ', 'か', 'すい', 'もく', 'きん', 'ど'];

            while (count < 20) {
                const dayOfWeekNum = currentDate.getDay();
                
                if (dayOfWeekNum !== 0 && dayOfWeekNum !== 6) {
                    const index = count;
                    const month = currentDate.getMonth() + 1;
                    const date = currentDate.getDate();
                    const dayOfWeek = dayNames[dayOfWeekNum];
                    const formattedDate = `${month}月${date}日 (${dayOfWeek})`;
                    const hiraganaReading = `${monthKana[month - 1]} ${dateKana[date]} (${dayKana[dayOfWeekNum]})`;

                    const tr = document.createElement('tr');
                    tr.className = index % 2 === 0 ? 'bg-white hover:bg-slate-50/50' : 'bg-slate-50/40 hover:bg-slate-50/70';
                    
                    tr.innerHTML = `
                        <td class="py-3 px-1 text-center align-middle">
                            <div class="flex items-center justify-center w-full">
                                <button onclick="toggleCheck('yuki', ${index})" class="check-anim inline-flex items-center justify-center w-8 h-8 rounded-lg border-2 ${state.yuki[index] ? 'bg-sky-300 border-sky-300 text-white shadow-sm' : 'border-slate-200 text-slate-300 hover:border-sky-200'} font-bold text-xs">
                                    ${state.yuki[index] ? '<i class="fa-solid fa-check"></i>' : ''}
                                </button>
                            </div>
                        </td>
                        <td class="py-3 px-2 text-center align-middle">
                            <div class="font-bold text-slate-700 text-sm sm:text-base tracking-wide">${formattedDate}</div>
                            <div class="text-[11px] font-medium text-slate-400 mt-0.5">${hiraganaReading}</div>
                        </td>
                        <td class="py-3 px-1 text-center align-middle">
                            <div class="flex items-center justify-center w-full">
                                <button onclick="toggleCheck('hikari', ${index})" class="check-anim inline-flex items-center justify-center w-8 h-8 rounded-lg border-2 ${state.hikari[index] ? 'bg-pink-300 border-pink-300 text-white shadow-sm' : 'border-slate-200 text-slate-300 hover:border-pink-200'} font-bold text-xs">
                                    ${state.hikari[index] ? '<i class="fa-solid fa-check"></i>' : ''}
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                    count++;
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
        }

        function manualSave() {
            saveToSupabase();
        }

        function showToast(message) {
            const toast = document.getElementById('toast-message');
            const toastText = document.getElementById('toast-text');
            if (!toast || !toastText) return;

            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 2000);
        }

        function toggleCheck(user, index) {
            state[user][index] = !state[user][index];
            renderTracker();
            updateProgress();
            saveToSupabase();
        }

        function updateProgress() {
            const yukiCount = state.yuki.filter(Boolean).length;
            const hikariCount = state.hikari.filter(Boolean).length;

            const yukiPercent = Math.round((yukiCount / 20) * 100);
            const hikariPercent = Math.round((hikariCount / 20) * 100);

            const yukiCountEl = document.getElementById('yuki-count');
            const yukiBarEl = document.getElementById('yuki-bar');
            const yukiPercentEl = document.getElementById('yuki-percent');

            if (yukiCountEl) yukiCountEl.innerHTML = `${yukiCount} <span class="text-xs text-slate-400 font-normal">/ 20日</span>`;
            if (yukiBarEl) yukiBarEl.style.width = `${yukiPercent}%`;
            if (yukiPercentEl) yukiPercentEl.innerText = `達成率 ${yukiPercent}%`;

            const hikariCountEl = document.getElementById('hikari-count');
            const hikariBarEl = document.getElementById('hikari-bar');
            const hikariPercentEl = document.getElementById('hikari-percent');

            if (hikariCountEl) hikariCountEl.innerHTML = `${hikariCount} <span class="text-xs text-slate-400 font-normal">/ 20日</span>`;
            if (hikariBarEl) hikariBarEl.style.width = `${hikariPercent}%`;
            if (hikariPercentEl) hikariPercentEl.innerText = `達成率 ${hikariPercent}%`;
        }
    </script>
</body>
</html>
